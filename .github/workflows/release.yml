# Builds Catnip for Linux and Apple Silicon macOS. A version tag such as v0.1.0 also publishes
# the builds as a GitHub Release; a manual run only keeps them as workflow artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            asset: catnip-linux-x86_64.tar.gz
          - os: macos-latest
            asset: Catnip-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package for Linux
        if: runner.os == 'Linux'
        run: |
          mkdir catnip
          cp target/release/catnip LICENSE README.md catnip/
          cp assets/logo.svg catnip/catnip.svg
          tar -czf "${{ matrix.asset }}" catnip
      - name: Package for macOS
        if: runner.os == 'macOS'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app=Catnip.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources" catnip.iconset
          cp target/release/catnip "$app/MacOS/catnip"
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/logo-1024.png --out "catnip.iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size * 2)) $((size * 2)) assets/logo-1024.png --out "catnip.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns catnip.iconset -o "$app/Resources/catnip.icns"
          cat > "$app/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Catnip</string>
            <key>CFBundleDisplayName</key><string>Catnip</string>
            <key>CFBundleIdentifier</key><string>io.github.silvixp.catnip</string>
            <key>CFBundleExecutable</key><string>catnip</string>
            <key>CFBundleIconFile</key><string>catnip</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Info.plist"
          codesign --force --deep --sign - Catnip.app
          ditto -c -k --keepParent Catnip.app "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --title "Catnip $GITHUB_REF_NAME" --generate-notes
