[package]
name = "catnip"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A desktop app to review GitHub pull requests from the keyboard"
repository = "https://github.com/PFigs/catnip"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "catnip"
path = "src/main.rs"

[dependencies]
rune = { git = "https://github.com/PFigs/rune", rev = "f0d8a1d5f4de4d00b38fd83dd485264b198388a4" }
rune-kit = { git = "https://github.com/PFigs/rune", rev = "f0d8a1d5f4de4d00b38fd83dd485264b198388a4", features = ["markdown"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", features = ["json"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage", "Request", "RequestInit", "Headers", "Response"] }
js-sys = "0.3"

[patch.crates-io]
wgpu-hal = { git = "https://github.com/PFigs/rune", rev = "f0d8a1d5f4de4d00b38fd83dd485264b198388a4" }
winit = { git = "https://github.com/PFigs/rune", rev = "f0d8a1d5f4de4d00b38fd83dd485264b198388a4" }
parley_engine = { git = "https://github.com/PFigs/rune", rev = "f0d8a1d5f4de4d00b38fd83dd485264b198388a4" }
accesskit_windows = { git = "https://github.com/PFigs/rune", rev = "f0d8a1d5f4de4d00b38fd83dd485264b198388a4" }
accesskit_macos = { git = "https://github.com/PFigs/rune", rev = "f0d8a1d5f4de4d00b38fd83dd485264b198388a4" }
